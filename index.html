<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bunny Friend</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Forest backdrop -->
  <svg id="forest" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <!-- Sky -->
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bfe9ff"/>
        <stop offset="100%" stop-color="#e9f8e2"/>
      </linearGradient>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff4b3"/>
        <stop offset="100%" stop-color="#ffd966"/>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="1200" height="700" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="990" cy="120" r="55" fill="url(#sun)"/>

    <!-- Clouds -->
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="180" cy="110" rx="55" ry="18"/>
      <ellipse cx="220" cy="95" rx="40" ry="20"/>
      <ellipse cx="260" cy="115" rx="50" ry="16"/>

      <ellipse cx="700" cy="80" rx="50" ry="16"/>
      <ellipse cx="740" cy="95" rx="38" ry="18"/>
    </g>

    <!-- Distant hills -->
    <path d="M 0 500 Q 200 380 400 460 T 800 440 T 1200 470 L 1200 700 L 0 700 Z" fill="#9ed79b"/>

    <!-- Back row trees (pines, smaller and lighter) -->
    <g>
      <g transform="translate(60,330)">
        <rect x="-6" y="120" width="12" height="40" fill="#6b4226"/>
        <polygon points="-40,120 40,120 0,40" fill="#3f8a4c"/>
        <polygon points="-32,80 32,80 0,10" fill="#3f8a4c"/>
      </g>
      <g transform="translate(180,350)">
        <rect x="-6" y="120" width="12" height="40" fill="#6b4226"/>
        <polygon points="-40,120 40,120 0,40" fill="#4ea35d"/>
        <polygon points="-32,80 32,80 0,10" fill="#4ea35d"/>
      </g>
      <g transform="translate(450,340)">
        <rect x="-6" y="120" width="12" height="40" fill="#6b4226"/>
        <polygon points="-40,120 40,120 0,40" fill="#3f8a4c"/>
        <polygon points="-32,80 32,80 0,10" fill="#3f8a4c"/>
      </g>
      <g transform="translate(820,345)">
        <rect x="-6" y="120" width="12" height="40" fill="#6b4226"/>
        <polygon points="-40,120 40,120 0,40" fill="#4ea35d"/>
        <polygon points="-32,80 32,80 0,10" fill="#4ea35d"/>
      </g>
      <g transform="translate(1100,335)">
        <rect x="-6" y="120" width="12" height="40" fill="#6b4226"/>
        <polygon points="-40,120 40,120 0,40" fill="#3f8a4c"/>
        <polygon points="-32,80 32,80 0,10" fill="#3f8a4c"/>
      </g>
    </g>

    <!-- Front row trees (bigger leafy trees) -->
    <g>
      <g transform="translate(120,470)">
        <rect x="-14" y="0" width="28" height="100" fill="#6b4226"/>
        <circle cx="0" cy="-20" r="65" fill="#2f7d3b"/>
        <circle cx="-45" cy="0" r="48" fill="#37923f"/>
        <circle cx="45" cy="0" r="48" fill="#37923f"/>
      </g>
      <g transform="translate(1080,470)">
        <rect x="-14" y="0" width="28" height="100" fill="#6b4226"/>
        <circle cx="0" cy="-20" r="65" fill="#2f7d3b"/>
        <circle cx="-45" cy="0" r="48" fill="#37923f"/>
        <circle cx="45" cy="0" r="48" fill="#37923f"/>
      </g>
    </g>

    <!-- Grass foreground -->
    <path d="M 0 560 Q 300 520 600 555 T 1200 555 L 1200 700 L 0 700 Z" fill="#5fbf5f"/>

    <!-- Bushes near the bunny area -->
    <g>
      <g transform="translate(280,610)">
        <ellipse cx="0" cy="0" rx="55" ry="28" fill="#3f9b4d"/>
        <ellipse cx="-30" cy="-10" rx="25" ry="18" fill="#4cb05b"/>
        <ellipse cx="25" cy="-12" rx="28" ry="20" fill="#4cb05b"/>
      </g>
      <g transform="translate(920,615)">
        <ellipse cx="0" cy="0" rx="60" ry="30" fill="#3f9b4d"/>
        <ellipse cx="-32" cy="-12" rx="26" ry="20" fill="#4cb05b"/>
        <ellipse cx="28" cy="-14" rx="30" ry="22" fill="#4cb05b"/>
      </g>
    </g>

    <!-- Little flowers -->
    <g>
      <g transform="translate(360,640)">
        <circle cx="0" cy="0" r="5" fill="#ffd1dc"/>
        <circle cx="-6" cy="-3" r="4" fill="#ffd1dc"/>
        <circle cx="6" cy="-3" r="4" fill="#ffd1dc"/>
        <circle cx="0" cy="0" r="2" fill="#ffe066"/>
      </g>
      <g transform="translate(820,650)">
        <circle cx="0" cy="0" r="5" fill="#ffffff"/>
        <circle cx="-6" cy="-3" r="4" fill="#ffffff"/>
        <circle cx="6" cy="-3" r="4" fill="#ffffff"/>
        <circle cx="0" cy="0" r="2" fill="#ffe066"/>
      </g>
      <g transform="translate(600,665)">
        <circle cx="0" cy="0" r="5" fill="#ffb3ff"/>
        <circle cx="-6" cy="-3" r="4" fill="#ffb3ff"/>
        <circle cx="6" cy="-3" r="4" fill="#ffb3ff"/>
        <circle cx="0" cy="0" r="2" fill="#ffe066"/>
      </g>
    </g>
  </svg>

  <h1>Click the Bunny!</h1>
  <p class="hint">Try the ears, the nose, the paws, the belly… and the tail. 🐰</p>

  <div class="stage">
    <div id="bubble" class="bubble hidden"></div>

    <svg id="bunny" viewBox="0 0 400 510" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyGrad" cx="38%" cy="28%" r="72%">
          <stop offset="0%"   stop-color="#eee7de"/>
          <stop offset="55%"  stop-color="#d5cab8"/>
          <stop offset="100%" stop-color="#a89888"/>
        </radialGradient>
        <radialGradient id="headGrad" cx="42%" cy="30%" r="70%">
          <stop offset="0%"   stop-color="#f4ede5"/>
          <stop offset="52%"  stop-color="#ddd2c5"/>
          <stop offset="100%" stop-color="#b5a595"/>
        </radialGradient>
        <radialGradient id="bellyGrad" cx="50%" cy="42%" r="58%">
          <stop offset="0%"   stop-color="#faf8f4"/>
          <stop offset="100%" stop-color="#e6ddd2"/>
        </radialGradient>
        <radialGradient id="muzzleGrad" cx="50%" cy="38%" r="60%">
          <stop offset="0%"   stop-color="#f6f1ec"/>
          <stop offset="100%" stop-color="#ddd4c8"/>
        </radialGradient>
        <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#c5bdb2"/>
          <stop offset="45%"  stop-color="#dcd4c8"/>
          <stop offset="100%" stop-color="#b8b0a5"/>
        </linearGradient>
        <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#e090a8"/>
          <stop offset="50%"  stop-color="#f0b0c0"/>
          <stop offset="100%" stop-color="#d87898"/>
        </linearGradient>
        <radialGradient id="irisGrad" cx="35%" cy="28%" r="72%">
          <stop offset="0%"   stop-color="#7a5040"/>
          <stop offset="65%"  stop-color="#3c1e10"/>
          <stop offset="100%" stop-color="#150805"/>
        </radialGradient>
        <radialGradient id="noseGrad" cx="38%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#e87888"/>
          <stop offset="100%" stop-color="#b84858"/>
        </radialGradient>
        <radialGradient id="pawGrad" cx="40%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#ece4da"/>
          <stop offset="100%" stop-color="#bfaf9e"/>
        </radialGradient>
        <radialGradient id="tailGrad" cx="36%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#f8f5f0"/>
          <stop offset="100%" stop-color="#c5bdb2"/>
        </radialGradient>
        <radialGradient id="neckShadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#8a7a6a" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#8a7a6a" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ── TAIL (drawn first so body overlaps it) ── -->
      <g class="part" data-part="tail">
        <circle cx="316" cy="422" r="26" fill="url(#tailGrad)" stroke="#c0b5a8" stroke-width="1.2"/>
        <!-- fluffy fur lines on tail -->
        <path d="M 302,410 C 306,404 314,402 318,405" stroke="#e8e2da" stroke-width="0.9" fill="none" opacity="0.7"/>
        <path d="M 300,422 C 304,416 312,415 316,418" stroke="#e8e2da" stroke-width="0.9" fill="none" opacity="0.6"/>
      </g>

      <!-- ── EARS (paths — base sits inside head so connection is seamless) ── -->
      <g class="part" data-part="ear">
        <!-- left ear outer -->
        <path d="M 148,140 C 136,108 108,60 110,22 C 111,8 124,2 140,6 C 156,2 168,8 168,22 C 168,62 162,108 176,140 Z"
              fill="url(#earGrad)" stroke="#a09080" stroke-width="1.5"/>
        <!-- left ear inner pink -->
        <path d="M 151,134 C 141,106 118,66 120,28 C 122,16 131,12 140,14 C 149,12 158,18 157,30 C 156,68 155,108 170,132 Z"
              fill="url(#innerEarGrad)"/>
        <!-- left ear tip shading -->
        <ellipse cx="139" cy="12" rx="18" ry="10" fill="#9a8e82" opacity="0.25"/>
      </g>
      <g class="part" data-part="ear">
        <!-- right ear outer (mirror of left) -->
        <path d="M 252,140 C 264,108 292,60 290,22 C 289,8 276,2 260,6 C 244,2 232,8 232,22 C 232,62 238,108 224,140 Z"
              fill="url(#earGrad)" stroke="#a09080" stroke-width="1.5"/>
        <!-- right ear inner pink -->
        <path d="M 249,134 C 259,106 282,66 280,28 C 278,16 269,12 260,14 C 251,12 242,18 243,30 C 244,68 245,108 230,132 Z"
              fill="url(#innerEarGrad)"/>
        <!-- right ear tip shading -->
        <ellipse cx="261" cy="12" rx="18" ry="10" fill="#9a8e82" opacity="0.25"/>
      </g>

      <!-- ── BODY ── -->
      <g class="part" data-part="belly">
        <path d="M 150,308
                 C 116,320 78,360 78,405
                 C 78,456 116,494 200,498
                 C 284,494 322,456 322,405
                 C 322,360 284,320 250,308 Z"
              fill="url(#bodyGrad)" stroke="#a09080" stroke-width="1.5"/>
        <!-- belly highlight -->
        <ellipse cx="200" cy="418" rx="84" ry="70" fill="url(#bellyGrad)"/>
        <!-- subtle body fur strokes -->
        <path d="M 104,374 C 108,362 118,356 125,360" stroke="#c8bfb5" stroke-width="0.9" fill="none" opacity="0.55"/>
        <path d="M 288,372 C 285,360 275,354 268,358" stroke="#c8bfb5" stroke-width="0.9" fill="none" opacity="0.55"/>
        <path d="M 118,430 C 122,420 130,416 136,419" stroke="#c8bfb5" stroke-width="0.9" fill="none" opacity="0.45"/>
      </g>

      <!-- ── REAR FEET (flat on ground at bottom of body) ── -->
      <g class="part" data-part="paw">
        <ellipse cx="163" cy="472" rx="44" ry="22" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.5"/>
        <path d="M 138,462 C 136,454 140,449 144,450" stroke="#bfafa0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M 157,458 C 156,450 159,446 163,447" stroke="#bfafa0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M 177,462 C 178,454 181,450 184,452" stroke="#bfafa0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="part" data-part="paw">
        <ellipse cx="237" cy="472" rx="44" ry="22" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.5"/>
        <path d="M 216,462 C 214,454 217,449 221,450" stroke="#bfafa0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M 232,458 C 231,450 235,446 239,447" stroke="#bfafa0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M 252,462 C 253,454 256,450 259,452" stroke="#bfafa0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- ── FRONT PAWS / ARMS ── -->
      <!-- left: toe ovals drawn first (behind arm), then arm on top so toes peek out below -->
      <g class="part" data-part="front-paw">
        <ellipse cx="142" cy="432" rx="12" ry="14" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.2"/>
        <ellipse cx="158" cy="436" rx="12" ry="14" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.2"/>
        <ellipse cx="174" cy="432" rx="12" ry="14" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.2"/>
        <!-- forearm body -->
        <path d="M 131,380
                 C 129,360 135,341 145,334
                 C 150,330 156,328 158,328
                 C 160,328 166,330 171,334
                 C 181,341 187,360 185,380
                 C 187,399 185,416 184,424
                 L 132,424
                 C 131,416 129,399 131,380 Z"
              fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.5"/>
        <!-- upper highlight -->
        <ellipse cx="151" cy="356" rx="14" ry="10" fill="white" opacity="0.18"/>
        <!-- crease where arm meets toes -->
        <path d="M 132,422 C 140,417 176,417 184,422" stroke="#a09080" stroke-width="1" fill="none" opacity="0.5"/>
        <!-- subtle pad shadow -->
        <ellipse cx="158" cy="421" rx="20" ry="7" fill="#b0a090" opacity="0.18"/>
      </g>

      <!-- right: same mirrored -->
      <g class="part" data-part="front-paw">
        <ellipse cx="226" cy="432" rx="12" ry="14" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.2"/>
        <ellipse cx="242" cy="436" rx="12" ry="14" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.2"/>
        <ellipse cx="258" cy="432" rx="12" ry="14" fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.2"/>
        <path d="M 215,380
                 C 213,360 219,341 229,334
                 C 234,330 240,328 242,328
                 C 244,328 250,330 255,334
                 C 265,341 271,360 269,380
                 C 271,399 269,416 268,424
                 L 216,424
                 C 215,416 213,399 215,380 Z"
              fill="url(#pawGrad)" stroke="#a09080" stroke-width="1.5"/>
        <ellipse cx="233" cy="356" rx="14" ry="10" fill="white" opacity="0.18"/>
        <path d="M 216,422 C 224,417 260,417 268,422" stroke="#a09080" stroke-width="1" fill="none" opacity="0.5"/>
        <ellipse cx="242" cy="421" rx="20" ry="7" fill="#b0a090" opacity="0.18"/>
      </g>

      <!-- neck shadow for depth -->
      <ellipse cx="200" cy="310" rx="56" ry="16" fill="url(#neckShadow)"/>

      <!-- ── HEAD ── -->
      <circle cx="200" cy="215" r="100" fill="url(#headGrad)" stroke="#a09080" stroke-width="1.5"/>

      <!-- forehead glow -->
      <ellipse cx="192" cy="148" rx="32" ry="22" fill="white" opacity="0.13"/>

      <!-- head fur texture -->
      <path d="M 160,148 C 163,138 172,134 178,137" stroke="#c8bfb5" stroke-width="0.9" fill="none" opacity="0.55"/>
      <path d="M 228,145 C 232,136 241,132 246,136" stroke="#c8bfb5" stroke-width="0.9" fill="none" opacity="0.55"/>
      <path d="M 186,128 C 189,118 197,114 202,117" stroke="#c8bfb5" stroke-width="0.9" fill="none" opacity="0.5"/>

      <!-- ── MUZZLE ── -->
      <ellipse cx="200" cy="268" rx="43" ry="29" fill="url(#muzzleGrad)"/>

      <!-- ── EYES ── -->
      <!-- left eye -->
      <ellipse cx="165" cy="206" rx="21" ry="22" fill="#180c06"/>
      <ellipse cx="165" cy="206" rx="17" ry="19" fill="url(#irisGrad)"/>
      <ellipse cx="165" cy="209" rx="10" ry="14" fill="#060202"/>
      <circle  cx="157" cy="199" r="5"   fill="white" opacity="0.95"/>
      <circle  cx="170" cy="214" r="2.5" fill="white" opacity="0.5"/>
      <path d="M 146,196 C 153,188 178,188 186,196" stroke="#38281a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- right eye -->
      <ellipse cx="235" cy="206" rx="21" ry="22" fill="#180c06"/>
      <ellipse cx="235" cy="206" rx="17" ry="19" fill="url(#irisGrad)"/>
      <ellipse cx="235" cy="209" rx="10" ry="14" fill="#060202"/>
      <circle  cx="227" cy="199" r="5"   fill="white" opacity="0.95"/>
      <circle  cx="240" cy="214" r="2.5" fill="white" opacity="0.5"/>
      <path d="M 214,196 C 222,188 247,188 255,196" stroke="#38281a" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- cheek blush -->
      <ellipse cx="147" cy="244" rx="19" ry="13" fill="#e0a0b0" opacity="0.32"/>
      <ellipse cx="253" cy="244" rx="19" ry="13" fill="#e0a0b0" opacity="0.32"/>

      <!-- ── NOSE ── -->
      <g class="part" data-part="nose">
        <path d="M 200,256
                 C 196,252 187,254 186,261
                 C 185,268 193,273 200,273
                 C 207,273 215,268 214,261
                 C 213,254 204,252 200,256 Z"
              fill="url(#noseGrad)" stroke="#905060" stroke-width="1"/>
        <!-- nose highlight -->
        <ellipse cx="195" cy="260" rx="4.5" ry="2.5" fill="white" opacity="0.38"/>
      </g>

      <!-- ── MOUTH ── -->
      <path d="M 200,273 L 200,284"                  stroke="#7a5858" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M 200,284 Q 190,294 181,290"          stroke="#7a5858" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M 200,284 Q 210,294 219,290"          stroke="#7a5858" stroke-width="1.6" fill="none" stroke-linecap="round"/>

      <!-- ── WHISKERS ── -->
      <g stroke="#c0b8b0" stroke-width="1" opacity="0.72">
        <line x1="184" y1="264" x2="125" y2="254"/>
        <line x1="184" y1="269" x2="122" y2="269"/>
        <line x1="184" y1="274" x2="127" y2="284"/>
        <line x1="216" y1="264" x2="275" y2="254"/>
        <line x1="216" y1="269" x2="278" y2="269"/>
        <line x1="216" y1="274" x2="273" y2="284"/>
      </g>

    </svg>

    <!-- ── RAINBOW FART CLOUD — positioned right of the tail ── -->
    <div id="fart-fx">
      <svg viewBox="0 0 220 210" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
        <defs>
          <filter id="rbglow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- 7-band rainbow arcs, elliptical for nice proportions -->
        <g filter="url(#rbglow)">
          <path class="r-arc r1" d="M 10,200 A 100,86 0 0,1 210,200" stroke="#FF1111" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path class="r-arc r2" d="M 22,200 A 88,76 0 0,1 198,200"  stroke="#FF8800" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path class="r-arc r3" d="M 34,200 A 76,65 0 0,1 186,200"  stroke="#FFE500" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path class="r-arc r4" d="M 46,200 A 64,55 0 0,1 174,200"  stroke="#22CC44" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path class="r-arc r5" d="M 58,200 A 52,45 0 0,1 162,200"  stroke="#1166FF" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path class="r-arc r6" d="M 70,200 A 40,35 0 0,1 150,200"  stroke="#6611CC" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path class="r-arc r7" d="M 82,200 A 28,24 0 0,1 138,200"  stroke="#CC44CC" stroke-width="12" fill="none" stroke-linecap="round"/>
        </g>

        <!-- Rising gas wisps -->
        <path class="wisp w1" d="M 95,177 Q 86,152 91,128 Q 96,104 89,82"  stroke="#77dd44" stroke-width="3"   fill="none" stroke-linecap="round"/>
        <path class="wisp w2" d="M 117,177 Q 126,152 121,128 Q 116,104 123,82" stroke="#77dd44" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="wisp w3" d="M 106,175 Q 106,150 103,122 Q 100,94 106,68"  stroke="#99ee55" stroke-width="2"  fill="none" stroke-linecap="round"/>

        <!-- Sparkles scattered around the rainbow -->
        <text class="sp s1"  x="14"  y="108">✦</text>
        <text class="sp s2"  x="194" y="118">✦</text>
        <text class="sp s3"  x="108" y="15">★</text>
        <text class="sp s4"  x="52"  y="56">✦</text>
        <text class="sp s5"  x="154" y="50">✦</text>
        <text class="sp s6"  x="80"  y="34">◆</text>
        <text class="sp s7"  x="128" y="28">✦</text>
        <text class="sp s8"  x="34"  y="80">✦</text>
        <text class="sp s9"  x="175" y="84">✦</text>
        <text class="sp s10" x="106" y="52">✦</text>

        <!-- Gassy cloud puffs at the base -->
        <ellipse class="c-puff cp1" cx="110" cy="198" rx="50" ry="17" fill="#dfffd4"/>
        <ellipse class="c-puff cp2" cx="82"  cy="187" rx="32" ry="22" fill="#dfffd4"/>
        <ellipse class="c-puff cp3" cx="138" cy="187" rx="32" ry="22" fill="#dfffd4"/>
        <ellipse class="c-puff cp4" cx="110" cy="178" rx="34" ry="20" fill="#dfffd4"/>
        <ellipse cx="110" cy="198" rx="50" ry="17" fill="none" stroke="#a8d8a0" stroke-width="1.5"/>
        <ellipse cx="82"  cy="187" rx="32" ry="22" fill="none" stroke="#a8d8a0" stroke-width="1.5"/>
        <ellipse cx="138" cy="187" rx="32" ry="22" fill="none" stroke="#a8d8a0" stroke-width="1.5"/>
        <ellipse cx="110" cy="178" rx="34" ry="20" fill="none" stroke="#a8d8a0" stroke-width="1.5"/>
      </svg>
    </div>

    <div id="color-card" class="hidden"><span class="card-emoji">🌈</span></div>
    <div id="carrot" aria-hidden="true">🥕</div>
  </div>

  <script src="bunny.js"></script>
</body>
</html>
